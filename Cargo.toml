[package]
name = "goodnight"
version = "1.0.0"
edition = "2024"
description = "Temporizador para adormecer: baixa o volume aos poucos e desliga o computador (Windows e Linux)"
license = "MIT"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Power"] }

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
winresource = "0.1.34"
